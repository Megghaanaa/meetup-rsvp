<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetup RSVP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3f5fb;
      --card: #ffffff;
      --ink: #16213e;
      --slate: #5b6478;
      --line: #d9deea;
      --marigold: #f2a900;
      --teal: #0f7f81;
      --danger: #c2410c;
      --radius-ticket: 18px;
      --radius-control: 10px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--paper);
    }
    :focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }

    .shell { max-width: 1120px; margin: 0 auto; padding: 48px 28px 72px; }

    /* Header */
    .masthead { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 40px; flex-wrap: wrap; }
    .masthead h1 {
      margin: 0;
      font-size: clamp(2.6rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.035em;
    }
    .masthead p { margin: 12px 0 0; max-width: 46ch; color: var(--slate); font-size: 1.05rem; }
    .legend { display: flex; gap: 18px; color: var(--slate); font-size: 0.9rem; }
    .legend span { display: inline-flex; align-items: center; gap: 7px; }

    /* Layout */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
    .events-heading { margin: 0 0 16px; font-size: 1.25rem; font-weight: 700; }

    /* Ticket */
    .ticket {
      display: grid;
      grid-template-columns: 112px 1fr;
      background: var(--card);
      border-radius: var(--radius-ticket);
      margin-bottom: 20px;
      box-shadow: 0 1px 0 var(--line), 0 12px 32px -18px rgba(22, 33, 62, 0.35);
      position: relative;
    }
    .stub {
      background: var(--ink);
      color: #fff;
      border-radius: var(--radius-ticket) 0 0 var(--radius-ticket);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 20px 8px;
      position: relative;
    }
    /* Perforation between stub and body */
    .stub::after {
      content: "";
      position: absolute; right: -1px; top: 14px; bottom: 14px;
      border-right: 2px dashed var(--line);
    }
    .stub .month { font-size: 0.95rem; font-weight: 500; opacity: 0.75; }
    .stub .day { font-size: 2.8rem; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
    .stub .time { font-size: 0.9rem; margin-top: 6px; color: var(--marigold); font-weight: 600; }

    .ticket-body { padding: 22px 26px 22px 28px; min-width: 0; }
    .ticket-body h3 { margin: 0; font-size: 1.45rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.15; }
    .venue { margin: 4px 0 0; color: var(--slate); }

    /* The seat grid: the one memorable element */
    .seats { display: flex; flex-wrap: wrap; gap: 5px; margin: 18px 0 8px; }
    .seat {
      width: 14px; height: 14px; border-radius: 4px 4px 6px 6px;
      background: transparent; border: 2px solid var(--line);
    }
    .seat.taken { background: var(--marigold); border-color: var(--marigold); }
    .seat.just-taken { animation: sit 600ms cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes sit { 0% { transform: scale(0.2); } 100% { transform: scale(1); } }
    .meter { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 18px 0 8px; }
    .meter > div { height: 100%; background: var(--marigold); border-radius: 99px; }
    .count { margin: 0; font-size: 0.95rem; color: var(--slate); }
    .count strong { color: var(--ink); }
    .count.full strong { color: var(--danger); }

    /* Form controls */
    input, button { font: inherit; }
    input {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-control);
      background: #fff;
      color: var(--ink);
    }
    input:focus { border-color: var(--ink); outline: none; }
    input:focus-visible { outline: 3px solid var(--marigold); outline-offset: 1px; }
    button {
      padding: 11px 20px;
      border: none;
      border-radius: var(--radius-control);
      background: var(--teal);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #0b6668; }
    button:disabled { background: var(--line); color: var(--slate); cursor: not-allowed; }
    .msg { margin: 8px 0 0; font-size: 0.92rem; min-height: 1.4em; }
    .msg.error { color: var(--danger); }
    .msg.success { color: var(--teal); }

    /* Attendees */
    .people { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 6px; }
    .faces { display: flex; }
    .face {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 0.75rem; font-weight: 700;
      background: #e7ebf5; color: var(--ink);
      border: 2px solid #fff; margin-left: -6px;
    }
    .face:first-child { margin-left: 0; }
    .people small { color: var(--slate); font-size: 0.9rem; }

    /* Host panel */
    .host {
      position: sticky; top: 24px;
      background: var(--ink);
      color: #fff;
      border-radius: var(--radius-ticket);
      padding: 26px;
    }
    .host h2 { margin: 0; font-size: 1.35rem; font-weight: 700; }
    .host p.hint { margin: 4px 0 18px; color: #b7bfd6; font-size: 0.95rem; }
    .host form { display: grid; gap: 12px; }
    .host label { display: grid; gap: 5px; font-size: 0.9rem; color: #d5daea; }
    .host input { border-color: #2f3b5c; background: #1f2b4d; color: #fff; }
    .host input::placeholder { color: #8791ad; }
    .host input:focus { border-color: var(--marigold); }
    .host button { background: var(--marigold); color: var(--ink); margin-top: 4px; }
    .host button:hover { background: #ffbb1f; }
    .host .msg.success { color: var(--marigold); }
    .host .msg.error { color: #fdba74; }
    .pair { display: grid; grid-template-columns: 1fr 96px; gap: 10px; }

    /* Account area */
    .account { display: flex; align-items: center; gap: 12px; }
    .account img, .account .avatar {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      display: grid; place-items: center; background: var(--ink); color: #fff; font-weight: 700; font-size: 0.85rem;
    }
    .account .who { line-height: 1.2; }
    .account .who small { display: block; color: var(--slate); font-size: 0.85rem; }
    .btn-link {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 18px; border-radius: var(--radius-control);
      background: var(--ink); color: #fff; font-weight: 700; text-decoration: none; white-space: nowrap;
    }
    .btn-link:hover { background: #22305a; }
    .btn-quiet { background: transparent; color: var(--slate); border: 1.5px solid var(--line); padding: 8px 14px; }
    .btn-quiet:hover { background: #fff; color: var(--ink); }
    .host .btn-link { background: var(--marigold); color: var(--ink); width: 100%; }
    .host .btn-link:hover { background: #ffbb1f; }
    .action { margin-top: 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .going {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: var(--radius-control);
      background: #e6f4f1; color: var(--teal); font-weight: 700;
    }
    .host-line { margin: 2px 0 0; font-size: 0.9rem; color: var(--slate); }
    .banner { margin: -16px 0 28px; padding: 12px 16px; border-radius: var(--radius-control); background: #fff1e6; color: var(--danger); }
    .events-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

    .empty {
      border: 2px dashed var(--line);
      border-radius: var(--radius-ticket);
      padding: 40px 28px;
      color: var(--slate);
      font-size: 1.05rem;
    }

    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .host { position: static; order: -1; }
    }
    @media (max-width: 560px) {
      .shell { padding: 32px 16px 56px; }
      .ticket { grid-template-columns: 78px 1fr; }
      .stub .day { font-size: 2.1rem; }
      .stub .time { font-size: 0.78rem; text-align: center; }
      .ticket-body { padding: 18px; }
      .legend { display: none; }
      .account .who { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .seat.just-taken { animation: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div>
        <h1>Meetup RSVP</h1>
        <p>Know who's coming before the doors open. One seat per person, and never more people than chairs.</p>
      </div>
      <div class="account" id="account"></div>
    </header>
    <p class="banner" id="banner" role="alert" hidden></p>

    <div class="layout">
      <main>
        <div class="events-top">
          <h2 class="events-heading">Upcoming events</h2>
          <div class="legend" aria-hidden="true">
            <span><span class="seat taken"></span>Taken</span>
            <span><span class="seat"></span>Open</span>
          </div>
        </div>
        <div id="events" aria-live="polite"><p class="empty">Loading events…</p></div>
      </main>

      <aside class="host">
        <h2>Host an event</h2>
        <p class="hint">Set the room size. RSVPs close by themselves when it's full.</p>
        <div id="host-signin" hidden></div>
        <form id="create-form" hidden>
          <label>Event name
            <input name="title" placeholder="Python Meetup Mumbai" required maxlength="200">
          </label>
          <div class="pair">
            <label>Venue
              <input name="venue" placeholder="WeWork BKC" required maxlength="200">
            </label>
            <label>Seats
              <input name="capacity" type="number" min="1" max="10000" placeholder="30" required>
            </label>
          </div>
          <label>Starts
            <input name="starts_at" type="datetime-local" required>
          </label>
          <button type="submit">Create event</button>
          <p class="msg" id="create-msg" role="status"></p>
        </form>
      </aside>
    </div>
  </div>

  <script>
    const MAX_SEAT_ICONS = 60;
    const eventsEl = document.getElementById("events");
    let me = { user: null, google_configured: false };
    let lastRsvpEventId = null;

    function showMessage(el, text, kind) {
      el.textContent = text;
      el.className = "msg " + kind;
    }

    async function request(url, options = {}) {
      const res = await fetch(url, { headers: { "Content-Type": "application/json" }, ...options });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = Array.isArray(data.detail) ? "Check the form fields and try again." : data.detail;
        throw new Error(detail || "That didn't work. Try again.");
      }
      return data;
    }

    function initials(name) {
      return name.trim().split(/\s+/).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
    }

    function signInLink(label) {
      const a = document.createElement("a");
      a.className = "btn-link";
      a.href = "/login";
      a.textContent = label;
      return a;
    }

    function renderAccount() {
      const box = document.getElementById("account");
      box.innerHTML = "";
      if (me.user) {
        let pic;
        if (me.user.picture) {
          pic = document.createElement("img");
          pic.src = me.user.picture;
          pic.alt = "";
          pic.referrerPolicy = "no-referrer";
        } else {
          pic = document.createElement("span");
          pic.className = "avatar";
          pic.textContent = initials(me.user.name);
        }
        const who = document.createElement("div");
        who.className = "who";
        who.textContent = me.user.name;
        const email = document.createElement("small");
        email.textContent = me.user.email;
        who.appendChild(email);
        const out = document.createElement("button");
        out.className = "btn-quiet";
        out.textContent = "Sign out";
        out.addEventListener("click", async () => {
          await request("/logout", { method: "POST" });
          await refresh();
        });
        box.append(pic, who, out);
      } else if (me.google_configured) {
        box.appendChild(signInLink("Sign in with Google"));
      }

      // Host panel: form when signed in, sign-in button otherwise.
      const form = document.getElementById("create-form");
      const prompt = document.getElementById("host-signin");
      form.hidden = !me.user;
      document.getElementById("create-msg").textContent = "";
      prompt.hidden = !!me.user;
      prompt.innerHTML = "";
      if (!me.user) {
        prompt.appendChild(
          me.google_configured
            ? signInLink("Sign in with Google to host")
            : Object.assign(document.createElement("p"), {
                className: "hint",
                textContent: "Sign-in isn't set up yet. Add your Google keys to .env and restart.",
              })
        );
      }
    }

    function seatVisual(event, taken, animateLast) {
      if (event.capacity > MAX_SEAT_ICONS) {
        const meter = document.createElement("div");
        meter.className = "meter";
        const fill = document.createElement("div");
        fill.style.width = Math.min(100, (taken / event.capacity) * 100) + "%";
        meter.appendChild(fill);
        return meter;
      }
      const grid = document.createElement("div");
      grid.className = "seats";
      grid.setAttribute("aria-hidden", "true");
      for (let i = 0; i < event.capacity; i++) {
        const seat = document.createElement("span");
        seat.className = "seat" + (i < taken ? " taken" : "");
        if (animateLast && i === taken - 1) seat.classList.add("just-taken");
        grid.appendChild(seat);
      }
      return grid;
    }

    function ticket(event, people) {
      const start = new Date(event.starts_at);
      const taken = event.capacity - event.seats_left;
      const full = event.seats_left <= 0;

      const el = document.createElement("article");
      el.className = "ticket";
      el.innerHTML = `
        <div class="stub">
          <span class="month"></span>
          <span class="day"></span>
          <span class="time"></span>
        </div>
        <div class="ticket-body">
          <h3></h3>
          <p class="venue"></p>
          <p class="host-line"></p>
          <div class="seat-slot"></div>
          <p class="count ${full ? "full" : ""}"></p>
          <div class="action"></div>
          <p class="msg" role="status"></p>
          <div class="people"></div>
        </div>`;

      // User-supplied text always goes in via textContent, never innerHTML.
      el.querySelector(".month").textContent = start.toLocaleString([], { month: "short" });
      el.querySelector(".day").textContent = start.getDate();
      el.querySelector(".time").textContent = start.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      el.querySelector("h3").textContent = event.title;
      el.querySelector(".venue").textContent = event.venue;
      el.querySelector(".host-line").textContent = event.you_are_hosting ? "You're hosting this one" : "Hosted by " + event.host_name;
      el.querySelector(".seat-slot").replaceWith(seatVisual(event, taken, lastRsvpEventId === event.id));
      el.querySelector(".count").innerHTML = full
        ? `<strong>Full.</strong> All ${event.capacity} seats are taken.`
        : `<strong>${event.seats_left} of ${event.capacity}</strong> seats open`;

      const action = el.querySelector(".action");
      const msg = el.querySelector(".msg");
      if (event.you_are_going) {
        action.innerHTML = '<span class="going">✓ You\'re going</span>';
      } else if (full) {
        action.remove();
      } else if (!me.user) {
        if (me.google_configured) action.appendChild(signInLink("Sign in to reserve a seat"));
        else action.remove();
      } else {
        const btn = document.createElement("button");
        btn.textContent = "Reserve my seat";
        btn.addEventListener("click", async () => {
          btn.disabled = true;
          try {
            await request(`/events/${event.id}/rsvp`, { method: "POST" });
            lastRsvpEventId = event.id;
            await loadEvents();
            lastRsvpEventId = null;
          } catch (err) {
            btn.disabled = false;
            showMessage(msg, err.message, "error");
          }
        });
        action.appendChild(btn);
      }

      const peopleEl = el.querySelector(".people");
      if (people.length > 0) {
        const faces = document.createElement("div");
        faces.className = "faces";
        people.slice(0, 6).forEach((p) => {
          const f = document.createElement("span");
          f.className = "face";
          f.textContent = initials(p.name);
          f.title = p.name;
          faces.appendChild(f);
        });
        const label = document.createElement("small");
        const names = people.slice(0, 2).map((p) => p.name).join(", ");
        label.textContent = people.length > 2 ? `${names} and ${people.length - 2} more` : names;
        peopleEl.append(faces, label);
      }

      return el;
    }

    async function loadEvents() {
      const events = await request("/events");
      const attendeeLists = await Promise.all(events.map((ev) => request(`/events/${ev.id}/attendees`)));
      eventsEl.innerHTML = "";
      if (events.length === 0) {
        eventsEl.innerHTML = '<p class="empty">No events yet. Sign in and create one, and it will show up here for people to RSVP.</p>';
        return;
      }
      events.forEach((ev, i) => eventsEl.appendChild(ticket(ev, attendeeLists[i])));
    }

    async function refresh() {
      me = await request("/me");
      renderAccount();
      await loadEvents();
    }

    document.getElementById("create-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const body = Object.fromEntries(new FormData(form));
      body.capacity = Number(body.capacity);
      const msg = document.getElementById("create-msg");
      try {
        await request("/events", { method: "POST", body: JSON.stringify(body) });
        form.reset();
        showMessage(msg, "Event created. It's now open for RSVPs.", "success");
        await loadEvents();
      } catch (err) {
        showMessage(msg, err.message, "error");
      }
    });

    // Explain a failed Google sign-in, then tidy the address bar.
    const loginResult = new URLSearchParams(location.search).get("login");
    if (loginResult) {
      const banner = document.getElementById("banner");
      banner.textContent = loginResult === "unverified"
        ? "That Google account's email isn't verified, so it can't be used to sign in."
        : "Google sign-in didn't finish. Try signing in again.";
      banner.hidden = false;
      history.replaceState(null, "", "/");
    }

    refresh().catch(() => {
      eventsEl.innerHTML = '<p class="empty">Couldn\'t load events. Check that the server is running, then refresh.</p>';
    });
  </script>
</body>
</html>
